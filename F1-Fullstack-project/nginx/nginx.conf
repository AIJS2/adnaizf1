# Global HTTP settings for the F1 fullstack reverse proxy.
# The frontend container serves static files and proxies /api/ + /ws/ to
# the backend, so only port 80 needs to be exposed to the public.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Larger upload/body limit for telemetry payload round-trips.
    client_max_body_size 50m;

    # --- API reverse proxy -------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous read timeout so long telemetry calculations do not
        # interrupt mid-stream.
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- WebSocket reverse proxy -------------------------------------------
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keepalive timeout long enough for a full live session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Static frontend build ----------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Long-lived cache for immutable assets (hashed filenames from Vite).
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|webp|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Helpful 404 fallback (SPA routing means unknown paths still load the app).
    error_page 404 /index.html;
}
