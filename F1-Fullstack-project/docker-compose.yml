version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: f1-redis
    # Redis tidak diexpose ke host.
    # Untuk debug lokal sementara, bisa tambah mapping ports berikut:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: f1-backend
    # Port 8000 hanya dipakai internal oleh Docker network.
    # Akses publik lewat nginx (frontend container) di port 80.
    expose:
      - "8000"
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Frontend fetches /api/ + /ws/ secara relative; nginx akan proxy ke backend.
        - VITE_API_URL=http://localhost:5173
    container_name: f1-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
