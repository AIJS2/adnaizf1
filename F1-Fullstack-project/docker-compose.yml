version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: f1-redis
    # Redis tidak diexpose ke host.
    # Untuk debug lokal sementara, bisa tambah mapping ports berikut:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: f1-backend
    # Port 8000 hanya dipakai internal oleh Docker network.
    # Akses publik lewat nginx (frontend container) di port 80.
    expose:
      - "8000"
    env_file:
      - ./Backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost
      - API_KEY=${API_KEY:-}
    volumes:
      - backend_logs:/app/logs
      - backend_cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    args:
      # Empty = relative. The browser then calls the same origin and nginx
      # proxies /api/ + /ws/ to the backend. Baking an absolute localhost URL
      # here (the old `http://localhost:5173`) made every remote/deployed client
      # call its OWN 127.0.0.1 and fail.
      - VITE_API_URL=
    container_name: f1-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - nginx_cache:/var/cache/nginx/f1_api_cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  redis_data:
    name: f1-redis_data
  backend_logs:
    name: f1-backend_logs
  backend_cache:
    name: f1-backend_cache
  nginx_cache:
    name: f1-nginx_cache
